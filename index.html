<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity OTT Search Hub | Google Cloud Spanner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#10b981', // Emerald
                            600: '#059669',
                            700: '#047857'
                        },
                        darkBg: '#09090b',
                        cardBg: '#151518',
                        inputBg: '#1e1e24'
                    },
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Vis-network CDN (for Knowledge Graph visualization) -->
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
        }
        /* Hide scrollbars for chrome but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Vis network custom container style */
        #network-canvas {
            width: 100%;
            height: 100%;
            background-color: #111115;
            border-radius: 12px;
        }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-[#09090b] dark:text-zinc-50 min-h-screen transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Spinner Component
        function Loader() {
            return (
                <div className="flex flex-col items-center justify-center p-12 space-y-4">
                    <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-emerald-500"></div>
                    <span className="text-sm text-zinc-500 dark:text-zinc-400 font-medium">Querying Cloud Spanner...</span>
                </div>
            );
        }

        // Empty State Component
        function EmptyState({ title, message }) {
            return (
                <div className="flex flex-col items-center justify-center text-center p-16 border border-dashed border-zinc-200 dark:border-zinc-800 rounded-2xl bg-white dark:bg-zinc-900/20">
                    <i data-lucide="search-x" className="w-12 h-12 text-zinc-400 dark:text-zinc-600 mb-4"></i>
                    <h3 className="text-lg font-semibold text-zinc-950 dark:text-zinc-100">{title}</h3>
                    <p className="text-sm text-zinc-500 dark:text-zinc-400 mt-1 max-w-sm">{message}</p>
                </div>
            );
        }

        // App Component
        function App() {
            // General UI State
            const [theme, setTheme] = useState('dark');
            const [activeTab, setActiveTab] = useState('fts'); // 'fts', 'hybrid', 'graph'
            const [searchQuery, setSearchQuery] = useState('Dune');
            const [loading, setLoading] = useState(false);
            const [results, setResults] = useState([]);
            const [selectedTitle, setSelectedTitle] = useState(null);
            const [showDetailsModal, setShowDetailsModal] = useState(false);
            const [allAvailableTitles, setAllAvailableTitles] = useState([]);

            // Tab 1 (FTS) Filters state
            const [filterAgeRating, setAgeRating] = useState('');
            const [filterAccessTier, setAccessTier] = useState('');
            const [filterAudioLang, setAudioLang] = useState('');

            // Tab 2 (Hybrid) Alpha parameter
            const [alpha, setAlpha] = useState(0.4);

            // Tab 3 (Graph) GQL Traversal Seed state
            const [graphSeedId, setGraphSeedId] = useState('t-inception');
            const [graphData, setGraphSeedData] = useState(null);
            const networkRef = useRef(null);
            const containerRef = useRef(null);

            // Tab 4 (Console / SQL Studio) state
            const [consoleQuery, setConsoleQuery] = useState(`SELECT \n    ContentId,\n    PrimaryTitle,\n    ReleaseYear,\n    AgeRating,\n    ImdbRating,\n    AccessTier\nFROM Titles\nWHERE ReleaseYear >= 2020\nORDER BY ImdbRating DESC\nLIMIT 10;`);
            const [consoleResult, setConsoleResult] = useState(null);
            const [consoleLoading, setConsoleLoading] = useState(false);
            const [consoleError, setConsoleError] = useState('');

            // Background queries state (for copy-pasting back-end query representations)
            const [executedQueries, setExecutedQueries] = useState(null);

            // Fetch list of titles for seed selection
            useEffect(() => {
                fetch('/api/titles?limit=100')
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            setAllAvailableTitles(data.titles || []);
                        }
                    })
                    .catch(err => console.error("Error fetching titles:", err));
            }, []);

            // Handle theme toggling
            const toggleTheme = () => {
                const html = document.documentElement;
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    setTheme('light');
                } else {
                    html.classList.add('dark');
                    setTheme('dark');
                }
            };

             // Trigger searches
            const triggerSearch = (query = searchQuery) => {
                if (!query.trim()) return;
                setLoading(true);
                
                if (activeTab === 'fts') {
                    let url = `/api/search/fts?q=${encodeURIComponent(query)}&limit=24`;
                    if (filterAgeRating) url += `&age_rating=${filterAgeRating}`;
                    if (filterAccessTier) url += `&access_tier=${filterAccessTier}`;
                    if (filterAudioLang) url += `&audio_lang=${filterAudioLang}`;

                    fetch(url)
                        .then(res => res.json())
                        .then(data => {
                            setResults(data.results || []);
                            setExecutedQueries(data.executed_queries || null);
                            setLoading(false);
                        })
                        .catch(err => {
                            console.error(err);
                            setLoading(false);
                        });
                } else if (activeTab === 'hybrid') {
                    let url = `/api/search/hybrid?q=${encodeURIComponent(query)}&alpha=${alpha}&limit=24`;
                    if (filterAgeRating) url += `&age_rating=${filterAgeRating}`;
                    if (filterAccessTier) url += `&access_tier=${filterAccessTier}`;
                    if (filterAudioLang) url += `&audio_lang=${filterAudioLang}`;

                    fetch(url)
                        .then(res => res.json())
                        .then(data => {
                            setResults(data.results || []);
                            setExecutedQueries(data.executed_queries || null);
                            setLoading(false);
                        })
                        .catch(err => {
                            console.error(err);
                            setLoading(false);
                        });
                }
            };

            // Retrieve Title details for modal
            const handleTitleClick = (contentId) => {
                fetch(`/api/titles/${contentId}`)
                    .then(res => res.json())
                    .then(data => {
                        setSelectedTitle(data);
                        setShowDetailsModal(true);
                    })
                    .catch(err => console.error("Error fetching details:", err));
            };

            // Trigger Search on enter
            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    triggerSearch();
                }
            };

            // Handle tab changes
            useEffect(() => {
                if (activeTab === 'console') {
                    // Skip auto search on console load
                } else if (activeTab !== 'graph') {
                    triggerSearch();
                } else {
                    triggerGraphTraversal(graphSeedId);
                }
            }, [activeTab, filterAgeRating, filterAccessTier, filterAudioLang, alpha]);

            // Re-render Lucide icons on DOM changes
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Trigger Property Graph Traversal (Tab 3 GQL)
            const triggerGraphTraversal = (seedId) => {
                setLoading(true);
                setGraphSeedId(seedId);
                fetch(`/api/search/hyper-graph?seed_id=${seedId}&limit=35`)
                    .then(res => res.json())
                    .then(data => {
                        setLoading(false);
                        if (data.success) {
                            setGraphSeedData(data);
                            setExecutedQueries(data.executed_queries || null);
                            renderNetworkGraph(data.graph);
                        } else {
                            alert("Graph search error: " + (data.detail || "Unknown error"));
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        setLoading(false);
                    });
            };

            // Execute Custom SQL/GQL in Spanner SQL Studio
            const runConsoleQuery = (queryText = consoleQuery) => {
                setConsoleLoading(true);
                setConsoleError('');
                setConsoleResult(null);

                fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sql: queryText })
                })
                .then(res => res.json())
                .then(data => {
                    setConsoleLoading(false);
                    if (data.success) {
                        setConsoleResult({
                            columns: data.columns,
                            rows: data.rows
                        });
                    } else {
                        setConsoleError(data.error);
                    }
                })
                .catch(err => {
                    setConsoleLoading(false);
                    setConsoleError(err.message || 'Network error executing query');
                });
            };

            // Render interactive canvas with Vis-Network
            const renderNetworkGraph = (graph) => {
                if (!containerRef.current) return;

                // Structure nodes and styles based on node type
                const visNodes = graph.nodes.map(node => {
                    let color = '#3b82f6'; // Default blue for titles
                    let shape = 'dot';
                    let size = 15;
                    let fontColor = '#e4e4e7';
                    let border = '#1d4ed8';

                    if (node.type === 'seed') {
                        color = '#10b981'; // Emerald for seed
                        size = 25;
                        shape = 'dot';
                        border = '#047857';
                    } else if (node.type === 'person') {
                        color = '#a855f7'; // Purple for cast/directors
                        shape = 'triangle';
                        size = 14;
                        border = '#7e22ce';
                    } else if (node.type === 'franchise') {
                        color = '#f59e0b'; // Gold for universes
                        shape = 'star';
                        size = 16;
                        border = '#b45309';
                    }

                    return {
                        id: node.id,
                        label: node.label,
                        shape: shape,
                        size: size,
                        color: {
                            background: color,
                            border: border,
                            highlight: { background: '#ef4444', border: '#b91c1c' }
                        },
                        font: { color: fontColor, size: 12, face: 'DM Sans', strokeWidth: 1, strokeColor: '#09090b' },
                        title: `${node.label} (${node.type.toUpperCase()})`
                    };
                });

                const visEdges = graph.edges.map(edge => {
                    return {
                        from: edge.from,
                        to: edge.to,
                        label: edge.label,
                        color: { color: edge.color || '#4b5563', highlight: '#ef4444' },
                        font: { color: '#a1a1aa', size: 9, align: 'middle', face: 'DM Sans' },
                        arrows: edge.arrows ? 'to' : '',
                        smooth: { type: 'curvedCW', roundness: 0.15 }
                    };
                });

                const data = {
                    nodes: new vis.DataSet(visNodes),
                    edges: new vis.DataSet(visEdges)
                };

                const options = {
                    physics: {
                        enabled: true,
                        solver: 'forceAtlas2Based',
                        forceAtlas2Based: {
                            gravitationalConstant: -26,
                            centralGravity: 0.01,
                            springLength: 90,
                            springConstant: 0.08
                        },
                        stabilization: { iterations: 150 }
                    },
                    interaction: {
                        hover: true,
                        tooltipDelay: 100
                    }
                };

                // Destroy old network if any
                if (networkRef.current) {
                    networkRef.current.destroy();
                }

                // Initialize network graph
                const network = new vis.Network(containerRef.current, data, options);
                networkRef.current = network;

                // Handle clicking on nodes (re-centering GQL seed)
                network.on("selectNode", (params) => {
                    const selectedNodeId = params.nodes[0];
                    // If it is a Title node (starts with 't-'), allow centering on it as a new seed!
                    if (selectedNodeId && selectedNodeId.startsWith("t-")) {
                        triggerGraphTraversal(selectedNodeId);
                    }
                });
            };

            return (
                <div className="flex flex-col min-h-screen bg-zinc-50 dark:bg-[#09090b] transition-colors duration-300">
                    
                    {/* TOP HEADER */}
                    <header className="border-b border-zinc-200 dark:border-zinc-800 bg-white/60 dark:bg-zinc-950/60 backdrop-blur-md sticky top-0 z-40">
                        <div className="max-w-[1600px] mx-auto px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="bg-emerald-500 text-black p-2 rounded-xl flex items-center justify-center font-bold text-lg shadow-lg shadow-emerald-500/20">
                                    <i data-lucide="database" className="w-5 h-5"></i>
                                </div>
                                <div>
                                    <div className="flex items-center space-x-2">
                                        <h1 className="text-xl font-extrabold tracking-tight text-zinc-950 dark:text-zinc-50">Antigravity OTT Search</h1>
                                        <span className="text-[10px] bg-emerald-500/10 text-emerald-500 font-bold px-2 py-0.5 rounded-full border border-emerald-500/20">Spanner Live</span>
                                    </div>
                                    <p className="text-xs text-zinc-500 dark:text-zinc-400 font-medium">Enterprise Multi-Modal Search & Graph Exploration</p>
                                </div>
                            </div>

                            {/* Theme and App Meta Info */}
                            <div className="flex items-center space-x-4">
                                <div className="hidden md:flex items-center space-x-2 px-3 py-1.5 rounded-lg bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800">
                                    <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                                    <span className="text-xs font-semibold text-zinc-500 dark:text-zinc-400 font-mono">Instance: properties | DB: ott-search-db</span>
                                </div>
                                <button 
                                    onClick={toggleTheme} 
                                    className="p-2.5 rounded-xl border border-zinc-200 dark:border-zinc-800 text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-900 transition-colors"
                                >
                                    <i data-lucide={theme === 'dark' ? 'sun' : 'moon'} className="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* MAIN APP CONTAINER */}
                    <main className="flex-1 max-w-[1600px] w-full mx-auto p-6 flex flex-col space-y-6">
                        
                        {/* TAB BAR + SEARCH BOX ROW */}
                        <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 p-4 rounded-2xl bg-white dark:bg-[#0f0f13] border border-zinc-200 dark:border-zinc-800/80 shadow-sm shadow-black/5">
                            
                            {/* Segmented Tab Controls */}
                            <div className="pill-shaped-tabs bg-zinc-100 dark:bg-[#1a1a20] p-1.5 rounded-xl flex items-center space-x-1.5 self-start lg:self-auto">
                                <button 
                                    onClick={() => setActiveTab('fts')}
                                    className={`flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'fts' ? 'bg-white dark:bg-zinc-800 text-emerald-500 shadow-sm font-bold' : 'text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100'}`}
                                >
                                    <i data-lucide="text-search" className="w-4 h-4"></i>
                                    <span>Full-Text (FTS)</span>
                                </button>
                                <button 
                                    onClick={() => setActiveTab('hybrid')}
                                    className={`flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'hybrid' ? 'bg-white dark:bg-zinc-800 text-emerald-500 shadow-sm font-bold' : 'text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100'}`}
                                >
                                    <i data-lucide="sparkles" className="w-4 h-4"></i>
                                    <span>Hybrid Vector</span>
                                </button>
                                <button 
                                    onClick={() => setActiveTab('graph')}
                                    className={`flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'graph' ? 'bg-white dark:bg-zinc-800 text-emerald-500 shadow-sm font-bold' : 'text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100'}`}
                                >
                                    <i data-lucide="git-branch" className="w-4 h-4"></i>
                                    <span>GQL Property Graph</span>
                                </button>
                                <button 
                                    onClick={() => setActiveTab('console')}
                                    className={`flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'console' ? 'bg-white dark:bg-zinc-800 text-emerald-500 shadow-sm font-bold' : 'text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100'}`}
                                >
                                    <i data-lucide="terminal" className="w-4 h-4"></i>
                                    <span>Spanner Studio</span>
                                </button>
                            </div>

                            {/* Search Inputs (Conditional on Tab) */}
                            {activeTab !== 'graph' && activeTab !== 'console' ? (
                                <div className="flex-1 max-w-xl flex items-center space-x-3 relative">
                                    <div className="relative flex-1">
                                        <input 
                                            type="text" 
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            onKeyDown={handleKeyPress}
                                            placeholder={activeTab === 'fts' ? "Search title, actors, genres, or keywords..." : "Enter natural language concepts (e.g. mind-bending space exploration)..."}
                                            className="w-full bg-zinc-50 dark:bg-[#1a1a20] text-zinc-950 dark:text-zinc-50 border border-zinc-200 dark:border-zinc-800 rounded-xl pl-11 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/40 transition-all font-medium placeholder-zinc-400 dark:placeholder-zinc-600"
                                        />
                                        <i data-lucide="search" className="w-4 h-4 text-zinc-400 dark:text-zinc-500 absolute left-4 top-1/2 -translate-y-1/2"></i>
                                    </div>
                                    <button 
                                        onClick={() => triggerSearch()}
                                        disabled={loading}
                                        className="bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 text-black font-bold text-sm px-5 py-2.5 rounded-xl transition-all flex items-center space-x-2 shadow-lg shadow-emerald-500/25"
                                    >
                                        <i data-lucide="send" className="w-4 h-4"></i>
                                        <span>Search</span>
                                    </button>
                                </div>
                             ) : activeTab === 'graph' ? (
                                <div className="flex-1 max-w-xl flex items-center space-x-3">
                                    <div className="w-full">
                                        <select 
                                            value={graphSeedId}
                                            onChange={(e) => triggerGraphTraversal(e.target.value)}
                                            className="w-full bg-zinc-50 dark:bg-[#1a1a20] text-zinc-950 dark:text-zinc-50 border border-zinc-200 dark:border-zinc-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/40 transition-all font-semibold cursor-pointer"
                                        >
                                            {allAvailableTitles.map(t => (
                                                <option key={t.ContentId} value={t.ContentId}>
                                                    Seed Title: {t.PrimaryTitle} ({t.ReleaseYear})
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex-grow flex justify-end">
                                    <span className="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold px-3 py-1.5 rounded-xl flex items-center space-x-2">
                                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                        <span>Spanner Engine: Connected (Read-Only)</span>
                                    </span>
                                </div>
                            )}
                        </div>

                        {/* SPLIT SCREEN LAYOUT: FILTERS (LEFT) + RESULTS/CANVAS (RIGHT) */}
                        <div className="flex flex-col lg:flex-row gap-6 items-start">
                            
                            {/* SIDEBAR FILTER DRAWER (Left) */}
                            {activeTab !== 'graph' && activeTab !== 'console' && (
                                <aside className="w-full lg:w-72 bg-white dark:bg-[#0f0f13] border border-zinc-200 dark:border-zinc-800 rounded-2xl p-5 space-y-6 flex-shrink-0">
                                    <div className="flex items-center justify-between border-b border-zinc-100 dark:border-zinc-800 pb-3">
                                        <div className="flex items-center space-x-2">
                                            <i data-lucide="sliders-horizontal" className="w-4 h-4 text-emerald-500"></i>
                                            <h3 className="text-sm font-bold tracking-wide uppercase text-zinc-500 dark:text-zinc-400">Search Filters</h3>
                                        </div>
                                        {(filterAgeRating || filterAccessTier || filterAudioLang) && (
                                            <button 
                                                onClick={() => { setAgeRating(''); setAccessTier(''); setAudioLang(''); }}
                                                className="text-xs text-rose-500 hover:text-rose-600 font-bold transition-colors"
                                            >
                                                Clear All
                                            </button>
                                        )}
                                    </div>

                                    {/* FTS Filters details */}
                                    <div className="space-y-4">
                                        {/* Age Rating filter */}
                                        <div className="flex flex-col">
                                            <label className="text-xs font-semibold text-zinc-500 dark:text-zinc-400 mb-2">Age Rating</label>
                                            <select 
                                                value={filterAgeRating}
                                                onChange={(e) => setAgeRating(e.target.value)}
                                                className="bg-zinc-50 dark:bg-[#1a1a20] text-zinc-900 dark:text-zinc-200 border border-zinc-200 dark:border-zinc-800 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none"
                                            >
                                                <option value="">All Ratings</option>
                                                <option value="G">G (General Audience)</option>
                                                <option value="PG">PG (Parental Guidance)</option>
                                                <option value="PG-13">PG-13 (Teens)</option>
                                                <option value="R">R (Restricted)</option>
                                                <option value="TV-MA">TV-MA (Mature)</option>
                                            </select>
                                        </div>

                                        {/* Access Tier filter */}
                                        <div className="flex flex-col">
                                            <label className="text-xs font-semibold text-zinc-500 dark:text-zinc-400 mb-2">Access Tier</label>
                                            <select 
                                                value={filterAccessTier}
                                                onChange={(e) => setAccessTier(e.target.value)}
                                                className="bg-zinc-50 dark:bg-[#1a1a20] text-zinc-900 dark:text-zinc-200 border border-zinc-200 dark:border-zinc-800 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none"
                                            >
                                                <option value="">All Tiers</option>
                                                <option value="FREE_AVOD">Free with Ads (AVOD)</option>
                                                <option value="SVOD_STANDARD">Subscription Standard (SVOD)</option>
                                                <option value="SVOD_PREMIUM">Subscription Premium (SVOD Premium)</option>
                                                <option value="TVOD_RENT">Direct Rental (TVOD)</option>
                                            </select>
                                        </div>

                                        {/* Audio Languages filter */}
                                        <div className="flex flex-col">
                                            <label className="text-xs font-semibold text-zinc-500 dark:text-zinc-400 mb-2">Audio Track Language</label>
                                            <select 
                                                value={filterAudioLang}
                                                onChange={(e) => setAudioLang(e.target.value)}
                                                className="bg-zinc-50 dark:bg-[#1a1a20] text-zinc-900 dark:text-zinc-200 border border-zinc-200 dark:border-zinc-800 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none"
                                            >
                                                <option value="">Any Language</option>
                                                <option value="en">English (en)</option>
                                                <option value="es">Spanish (es)</option>
                                                <option value="fr">French (fr)</option>
                                                <option value="ja">Japanese (ja)</option>
                                                <option value="hi">Hindi (hi)</option>
                                            </select>

                                                </div>
                                                <pre className="p-4 bg-zinc-950 text-emerald-400 font-mono text-[10px] rounded-xl overflow-x-auto whitespace-pre leading-relaxed border border-zinc-900 shadow-inner max-h-60">
                                                    {executedQueries.substituted}
                                                </pre>
                                            </div>
                                        </React.Fragment>
                                    )}

                                    {activeTab === 'hybrid' && (
                                        <React.Fragment>
                                            {/* FTS Side */}
                                            <div className="flex flex-col space-y-2 border border-zinc-100 dark:border-zinc-800/80 p-4 rounded-xl">
                                                <div className="flex items-center justify-between pb-2 border-b border-zinc-200 dark:border-zinc-800">
                                                    <span className="text-xs font-bold text-blue-500 uppercase tracking-wider font-mono">Part 1: Keyword FTS Sub-query</span>
                                                    <button 
                                                        onClick={() => {
                                                            navigator.clipboard.writeText(executedQueries.substituted_fts);
                                                            alert("FTS query copied!");
                                                        }}
                                                        className="text-[10px] bg-blue-500/10 text-blue-500 hover:bg-blue-500/20 px-2 py-1 rounded font-bold transition-all flex items-center space-x-1"
                                                    >
                                                        <i data-lucide="copy" className="w-3 h-3"></i>
                                                        <span>Copy SQL</span>
                                                    </button>
                                                </div>
                                                <div className="space-y-3 pt-2">
                                                    <div>
                                                        <span className="text-[10px] text-zinc-500 font-bold uppercase block mb-1">Parameterized SQL:</span>
                                                        <pre className="p-2 bg-zinc-950 text-zinc-300 font-mono text-[9px] rounded-lg overflow-x-auto border border-zinc-900">{executedQueries.parameterized_fts}</pre>
                                                    </div>
                                                    <div>
                                                        <span className="text-[10px] text-zinc-500 font-bold uppercase block mb-1">Substituted SQL:</span>
                                                        <pre className="p-2 bg-zinc-950 text-emerald-400 font-mono text-[9px] rounded-lg overflow-x-auto border border-zinc-900">{executedQueries.substituted_fts}</pre>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Vector Side */}
                                            <div className="flex flex-col space-y-2 border border-zinc-100 dark:border-zinc-800/80 p-4 rounded-xl">
                                                <div className="flex items-center justify-between pb-2 border-b border-zinc-200 dark:border-zinc-800">
                                                    <span className="text-xs font-bold text-amber-500 uppercase tracking-wider font-mono">Part 2: Vector Similarity Sub-query</span>
                                                    <button 
                                                        onClick={() => {
                                                            navigator.clipboard.writeText(executedQueries.substituted_vector);
                                                            alert("Vector query copied!");
                                                        }}
                                                        className="text-[10px] bg-amber-500/10 text-amber-500 hover:bg-amber-500/20 px-2 py-1 rounded font-bold transition-all flex items-center space-x-1"
                                                    >
                                                        <i data-lucide="copy" className="w-3 h-3"></i>
                                                        <span>Copy SQL</span>
                                                    </button>
                                                </div>
                                                <div className="space-y-3 pt-2">
                                                    <div>
                                                        <span className="text-[10px] text-zinc-500 font-bold uppercase block mb-1">Parameterized SQL:</span>
                                                        <pre className="p-2 bg-zinc-950 text-zinc-300 font-mono text-[9px] rounded-lg overflow-x-auto border border-zinc-900">{executedQueries.parameterized_vector}</pre>
                                                    </div>
                                                    <div>
                                                        <span className="text-[10px] text-zinc-500 font-bold uppercase block mb-1">Substituted SQL (768-D Dimension array logic):</span>
                                                        <pre className="p-2 bg-zinc-950 text-emerald-400 font-mono text-[9px] rounded-lg overflow-x-auto border border-zinc-900">{executedQueries.substituted_vector}</pre>
                                                    </div>
                                                </div>
                                            </div>
                                        </React.Fragment>
                                    )}

                                    {activeTab === 'graph' && (
                                        <React.Fragment>
                                            {/* Co-Watch graph GQL */}
                                            <div className="flex flex-col space-y-2 border border-zinc-100 dark:border-zinc-800/80 p-4 rounded-xl">
                                                <div className="flex items-center justify-between pb-2 border-b border-zinc-200 dark:border-zinc-800">
                                                    <span className="text-xs font-bold text-[#10b981] uppercase tracking-wider font-mono">Hop 1: Co-Watch GQL</span>
                                                    <button 
                                                        onClick={() => {
                                                            navigator.clipboard.writeText(executedQueries.substituted_co_watch);
                                                            alert("Co-watch GQL query copied!");
                                                        }}
                                                        className="text-[10px] bg-[#10b981]/10 text-[#10b981] hover:bg-[#10b981]/20 px-2 py-1 rounded font-bold transition-all flex items-center space-x-1"
                                                    >
                                                        <i data-lucide="copy" className="w-3 h-3"></i>
                                                        <span>Copy GQL</span>
                                                    </button>
                                                </div>
                                                <div className="space-y-3 pt-2">
                                                    <pre className="p-2 bg-zinc-950 text-emerald-400 font-mono text-[9px] rounded-lg overflow-x-auto border border-zinc-900 max-h-40">{executedQueries.substituted_co_watch}</pre>
                                                </div>
                                            </div>

                                            {/* Talent graph GQL */}
                                            <div className="flex flex-col space-y-2 border border-zinc-100 dark:border-zinc-800/80 p-4 rounded-xl">
                                                <div className="flex items-center justify-between pb-2 border-b border-zinc-200 dark:border-zinc-800">
                                                    <span className="text-xs font-bold text-[#a855f7] uppercase tracking-wider font-mono">Hop 2: Talent Cast GQL</span>
                                                    <button 
                                                        onClick={() => {
                                                            navigator.clipboard.writeText(executedQueries.substituted_talent);
                                                            alert("Talent GQL query copied!");
                                                        }}
                                                        className="text-[10px] bg-[#a855f7]/10 text-[#a855f7] hover:bg-[#a855f7]/20 px-2 py-1 rounded font-bold transition-all flex items-center space-x-1"
                                                    >
                                                        <i data-lucide="copy" className="w-3 h-3"></i>
                                                        <span>Copy GQL</span>
                                                    </button>
                                                </div>
                                                <div className="space-y-3 pt-2">
                                                    <pre className="p-2 bg-zinc-950 text-emerald-400 font-mono text-[9px] rounded-lg overflow-x-auto border border-zinc-900 max-h-40">{executedQueries.substituted_talent}</pre>
                                                </div>
                                            </div>
                                        </React.Fragment>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MOVIE DETAILS MODAL & Simulated Video Player */}
                    {showDetailsModal && selectedTitle && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="bg-white dark:bg-[#0c0c10] border border-zinc-200 dark:border-zinc-800 rounded-2xl w-full max-w-4xl overflow-hidden shadow-2xl relative">
                                
                                {/* Dismiss button */}
                                <button 
                                    onClick={() => setShowDetailsModal(false)}
                                    className="absolute top-4 right-4 z-50 bg-black/60 p-2 rounded-full border border-zinc-800 hover:bg-zinc-800 text-zinc-200 transition-colors"
                                >
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>

                                {/* GORGEOUS MODAL TOP: Simulated Video Player frame */}
                                <div className="aspect-video w-full bg-zinc-950 relative border-b border-zinc-800 flex flex-col items-center justify-center group overflow-hidden">
                                    {/* Embed simple elegant stock trailers as high-quality video frames */}
                                    <iframe 
                                        src={selectedTitle.TrailerUrl || "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&loop=1&playlist=dQw4w9WgXcQ"} 
                                        className="w-full h-full border-0 absolute inset-0"
                                        allow="autoplay; encrypted-media; picture-in-picture"
                                        allowFullScreen
                                    ></iframe>
                                    <div className="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent pointer-events-none"></div>
                                </div>

                                {/* MODAL DETAILS */}
                                <div className="p-6 md:p-8 grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="md:col-span-2 space-y-4">
                                        <div className="flex flex-wrap items-center gap-2">
                                            <span className="text-xs bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-zinc-500 dark:text-zinc-400 font-bold px-2 py-0.5 rounded uppercase">
                                                {selectedTitle.ContentType}
                                            </span>
                                            <span className="text-xs bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-zinc-500 dark:text-zinc-400 font-mono px-2 py-0.5 rounded">
                                                {selectedTitle.ReleaseYear}
                                            </span>
                                            <span className="text-xs bg-rose-500/10 border border-rose-500/20 text-rose-500 font-bold px-2 py-0.5 rounded">
                                                {selectedTitle.AgeRating}
                                            </span>
                                            {selectedTitle.DurationMins && (
                                                <span className="text-xs bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-zinc-500 dark:text-zinc-400 font-medium px-2 py-0.5 rounded">
                                                    {selectedTitle.DurationMins} Mins
                                                </span>
                                            )}
                                        </div>

                                        <h2 className="text-3xl font-extrabold tracking-tight text-zinc-950 dark:text-zinc-50 leading-none">{selectedTitle.PrimaryTitle}</h2>
                                        {selectedTitle.Tagline && (
                                            <p className="text-sm font-semibold italic text-emerald-500">"{selectedTitle.Tagline}"</p>
                                        )}
                                        <p className="text-sm text-zinc-600 dark:text-zinc-300 leading-relaxed">{selectedTitle.Synopsis}</p>
                                        
                                        {/* Dynamic badges list for metadata */}
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4 border-t border-zinc-100 dark:border-zinc-800">
                                            <div>
                                                <h4 className="text-xs text-zinc-400 font-bold uppercase tracking-wider">Audio Tracks</h4>
                                                <div className="flex flex-wrap gap-1.5 mt-1.5">
                                                    {selectedTitle.AudioLanguages?.map(lang => (
                                                        <span key={lang} className="text-[10px] font-semibold bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 px-2 py-0.5 rounded text-zinc-500 dark:text-zinc-400 uppercase">
                                                            {lang}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                            <div>
                                                <h4 className="text-xs text-zinc-400 font-bold uppercase tracking-wider">Subtitles</h4>
                                                <div className="flex flex-wrap gap-1.5 mt-1.5">
                                                    {selectedTitle.SubtitleLanguages?.map(lang => (
                                                        <span key={lang} className="text-[10px] font-semibold bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 px-2 py-0.5 rounded text-zinc-500 dark:text-zinc-400 uppercase">
                                                            {lang}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* SIDE COLUMN: CAST / POPULARITY */}
                                    <div className="space-y-6 border-l border-zinc-100 dark:border-zinc-800 pl-0 md:pl-6">
                                        <div className="bg-zinc-50 dark:bg-zinc-900 p-4 rounded-xl border border-zinc-200/50 dark:border-zinc-800/40">
                                            <h4 className="text-xs text-zinc-400 font-bold uppercase tracking-wider">IMDb Rating</h4>
                                            <div className="flex items-baseline space-x-2 mt-1">
                                                <span className="text-3xl font-extrabold text-zinc-950 dark:text-zinc-50">★ {selectedTitle.ImdbRating?.toFixed(1) || "N/A"}</span>
                                                <span className="text-xs text-zinc-400 font-medium">/ 10</span>
                                            </div>
                                            <div className="flex items-center justify-between text-xs text-zinc-500 dark:text-zinc-400 mt-3 pt-3 border-t border-zinc-200 dark:border-zinc-800">
                                                <span>Popularity Rank</span>
                                                <span className="font-bold text-zinc-950 dark:text-zinc-100">{selectedTitle.PopularityScore?.toFixed(1)} %</span>
                                            </div>
                                        </div>

                                        <div className="space-y-3">
                                            <h4 className="text-xs text-zinc-400 font-bold uppercase tracking-wider">Cast & Crew</h4>
                                            <div className="space-y-2.5 max-h-48 overflow-y-auto no-scrollbar">
                                                {selectedTitle.genres?.map(genre => (
                                                    <span key={genre.Slug} className="inline-block text-[10px] font-bold bg-emerald-500/10 text-emerald-500 border border-emerald-500/15 px-2 py-0.5 rounded mr-1.5 uppercase">
                                                        {genre.Name}
                                                    </span>
                                                ))}
                                                <div className="pt-2 divide-y divide-zinc-100 dark:divide-zinc-800/60">
                                                    {selectedTitle.talent?.map((person, idx) => (
                                                        <div key={idx} className="py-2 flex items-center space-x-3 text-xs">
                                                            <div className="min-w-0">
                                                                <h5 className="font-bold text-zinc-900 dark:text-zinc-200 truncate">{person.FullName}</h5>
                                                                <span className="text-[10px] text-zinc-400 uppercase font-semibold">
                                                                    {person.Role?.replace('_', ' ')} {person.CharacterName ? `as ${person.CharacterName}` : ''}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Render the App
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
